<!DOCTYPE html>
<html lang="es-CO">
<head>
	<meta charset="UTF-8">
	<meta name="author" content="Smayth Castañeda">
	<meta name="description" content="Página con el ejercicio sobre evento focus sobre cajas de texto">
	<meta name="keywords" content="CSS, HTML, h1, p, título, párrafo, evento, focus">
	<meta name="viewport" content="initial-scale=1.0, width=device-width, user-scalable=No">
	<title>::.Evento focus sobre input.::</title>
	<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
	<header><h1>Demostración del evento focus sobre etiqueta < input ></h1></header>
	<section>
		<article>
			<header><h2>Evento Focus</h2></header>
			<p>Al realizar foco sobre las cajas de texto  nombres y apellidos, el fondo tendra un color verde (rgb(2,204,23))</p>
			<form>
				<table>
					<tr>
						<td colspan="2">
  							<label for="txtnombres">Nombres</label>
  						</td>
  						<td>
  							<input type="text" name="txtnombres" id="txtnombres"><br>
  						</td>
  					</tr>
  					<tr>
  						<td colspan="2">
  							<label for="txtapellidos">Apellidos</label> 
  						</td>
  						<td>
  							<input type="text" name="txtapellidos" id="txtapellidos">
  						</td>
  				</table>
			</form>
		</article>
	</section>
</body>
</html>
