<!DOCTYPE html>
<html lang="es-CO">
<head>
	<meta charset="UTF-8">
	<meta name="author" content="Smayth Castañeda" />
	<meta name="description" content="página con Ejemplo del uso del evento checked sobre una etiqueta radio y checkbox" />
	<meta name="keywords" content="CSS, HTML, selectores, selector, checked, checkbox, radio,evento">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=No">
	<title>::.Ejemplo evento Checked.::</title>
	<link rel="stylesheet" type="text/css" href="css/estilos.css">
<body>	
	<section>
		<header><h1>Ejemplo evento Checked</h1></header>		
		<article>
			<header><h2>Demo of the :checked selector</h2></header>
			<form action="">
  				<input type="radio" checked="checked" value="masculino" name="genero"> Masculino<br>
  				<input type="radio" value="femenino" name="genero"> Femenino<br>
  				<input type="checkbox" checked="checked" value="Bicicleta"> Tengo una Bicicleta<br>
  				<input type="checkbox" value="Carro"> Tengo un carro
			</form>
		</article>
	</section>
</body>

</head>
