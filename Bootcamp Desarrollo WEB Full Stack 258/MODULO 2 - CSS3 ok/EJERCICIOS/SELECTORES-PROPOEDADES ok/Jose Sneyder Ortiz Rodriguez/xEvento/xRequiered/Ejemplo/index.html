<!DOCTYPE html>

<head>
	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=No">
	<title>::.Evento required.::</title>
	<link rel="stylesheet" type="text/css" href="css/estilos.css">
</head>
<body>
	<section>
		<article>
			<header><h1>Demo of the :required selector</h1></header>			
			<p>An optional input element:<br>
				<input>
			</p>
			<p>A required input element:<br>
				<input required>
			</p>
			<p>
				The :required selector selects form elements with a "required" attribute.
			</p>
		</article>
	</section>
</body>
